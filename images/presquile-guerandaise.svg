<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Aperçu du site Immobilier de la Presqu'île Guérandaise">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ec"/>
      <stop offset="1" stop-color="#e9f4f7"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7e94"/>
      <stop offset="1" stop-color="#2c5e72"/>
    </linearGradient>
  </defs>

  <!-- Fond navigateur -->
  <rect width="600" height="400" fill="#f6f8fb"/>
  <rect x="0" y="0" width="600" height="34" fill="#0e1a2b"/>
  <circle cx="20" cy="17" r="5" fill="#c8a25b"/>
  <circle cx="38" cy="17" r="5" fill="#3f5a78"/>
  <circle cx="56" cy="17" r="5" fill="#3f5a78"/>
  <rect x="80" y="9" width="430" height="16" rx="8" fill="#1f3654"/>

  <!-- Visuel hero : bord de mer / marais salants -->
  <rect x="0" y="34" width="600" height="190" fill="url(#sky1)"/>
  <rect x="0" y="150" width="600" height="74" fill="url(#sea1)"/>
  <!-- marais salants -->
  <g fill="#d8c9a0" opacity="0.85">
    <rect x="0" y="190" width="600" height="34"/>
  </g>
  <g stroke="#b9a878" stroke-width="2">
    <line x1="120" y1="190" x2="120" y2="224"/>
    <line x1="260" y1="190" x2="260" y2="224"/>
    <line x1="400" y1="190" x2="400" y2="224"/>
    <line x1="0" y1="206" x2="600" y2="206"/>
  </g>
  <!-- soleil + barque -->
  <circle cx="470" cy="90" r="26" fill="#e3cf9f"/>
  <path d="M250 168 l40 0 -8 12 -24 0 z" fill="#1a2333"/>

  <!-- Titre incrusté -->
  <text x="40" y="100" font-family="Georgia, serif" font-size="26" fill="#0e1a2b" font-style="italic">Presqu'île</text>
  <text x="40" y="130" font-family="Georgia, serif" font-size="26" fill="#0e1a2b" font-style="italic">Guérandaise</text>

  <!-- Cartes de biens -->
  <g>
    <rect x="40" y="250" width="160" height="110" rx="10" fill="#ffffff" stroke="#e6eaf0"/>
    <rect x="40" y="250" width="160" height="62" rx="10" fill="#cfe0e6"/>
    <rect x="56" y="324" width="90" height="9" rx="4" fill="#1f3654"/>
    <rect x="56" y="340" width="60" height="8" rx="4" fill="#c8a25b"/>

    <rect x="220" y="250" width="160" height="110" rx="10" fill="#ffffff" stroke="#e6eaf0"/>
    <rect x="220" y="250" width="160" height="62" rx="10" fill="#d8c9a0"/>
    <rect x="236" y="324" width="90" height="9" rx="4" fill="#1f3654"/>
    <rect x="236" y="340" width="60" height="8" rx="4" fill="#c8a25b"/>

    <rect x="400" y="250" width="160" height="110" rx="10" fill="#ffffff" stroke="#e6eaf0"/>
    <rect x="400" y="250" width="160" height="62" rx="10" fill="#cfe0e6"/>
    <rect x="416" y="324" width="90" height="9" rx="4" fill="#1f3654"/>
    <rect x="416" y="340" width="60" height="8" rx="4" fill="#c8a25b"/>
  </g>
</svg>
