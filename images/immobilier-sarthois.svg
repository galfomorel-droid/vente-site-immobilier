<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Aperçu du site Immobilier Sarthois">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e6d0"/>
      <stop offset="1" stop-color="#eef4e9"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa15c"/>
      <stop offset="1" stop-color="#5f8344"/>
    </linearGradient>
  </defs>

  <!-- Fond navigateur -->
  <rect width="600" height="400" fill="#f6f8fb"/>
  <rect x="0" y="0" width="600" height="34" fill="#0e1a2b"/>
  <circle cx="20" cy="17" r="5" fill="#c8a25b"/>
  <circle cx="38" cy="17" r="5" fill="#3f5a78"/>
  <circle cx="56" cy="17" r="5" fill="#3f5a78"/>
  <rect x="80" y="9" width="430" height="16" rx="8" fill="#1f3654"/>

  <!-- Visuel hero : campagne sarthoise -->
  <rect x="0" y="34" width="600" height="190" fill="url(#sky2)"/>
  <rect x="0" y="168" width="600" height="56" fill="url(#field2)"/>
  <!-- collines -->
  <path d="M0 168 Q150 120 320 160 T600 150 L600 224 L0 224 Z" fill="#6f9450" opacity="0.55"/>
  <!-- maison de campagne -->
  <g>
    <rect x="420" y="120" width="80" height="48" fill="#e8e2d4" stroke="#1a2333" stroke-width="2"/>
    <path d="M412 120 L460 92 L508 120 Z" fill="#9c5a3c" stroke="#1a2333" stroke-width="2"/>
    <rect x="450" y="140" width="18" height="28" fill="#5f8344"/>
  </g>
  <!-- arbre -->
  <rect x="120" y="140" width="8" height="30" fill="#7a5230"/>
  <circle cx="124" cy="132" r="22" fill="#6f9450"/>

  <!-- Titre incrusté -->
  <text x="40" y="100" font-family="Georgia, serif" font-size="26" fill="#0e1a2b" font-style="italic">Immobilier</text>
  <text x="40" y="130" font-family="Georgia, serif" font-size="26" fill="#0e1a2b" font-style="italic">Sarthois</text>

  <!-- Cartes de biens -->
  <g>
    <rect x="40" y="250" width="160" height="110" rx="10" fill="#ffffff" stroke="#e6eaf0"/>
    <rect x="40" y="250" width="160" height="62" rx="10" fill="#dfe7d3"/>
    <rect x="56" y="324" width="90" height="9" rx="4" fill="#1f3654"/>
    <rect x="56" y="340" width="60" height="8" rx="4" fill="#c8a25b"/>

    <rect x="220" y="250" width="160" height="110" rx="10" fill="#ffffff" stroke="#e6eaf0"/>
    <rect x="220" y="250" width="160" height="62" rx="10" fill="#e8e2d4"/>
    <rect x="236" y="324" width="90" height="9" rx="4" fill="#1f3654"/>
    <rect x="236" y="340" width="60" height="8" rx="4" fill="#c8a25b"/>

    <rect x="400" y="250" width="160" height="110" rx="10" fill="#ffffff" stroke="#e6eaf0"/>
    <rect x="400" y="250" width="160" height="62" rx="10" fill="#dfe7d3"/>
    <rect x="416" y="324" width="90" height="9" rx="4" fill="#1f3654"/>
    <rect x="416" y="340" width="60" height="8" rx="4" fill="#c8a25b"/>
  </g>
</svg>
